name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: ["master"]
  schedule:
    # Refresh the OpenXBL snapshot every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: https://chojecki.net
    env:
      BUNDLE_WITHOUT: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build JavaScript and run regression tests
        run: |
          npm ci
          npm run build:js
          npm test
          npm run test:seo

      - name: Fetch Xbox activity
        continue-on-error: true
        run: node scripts/fetch-openxbl.mjs
        env:
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true

      - name: Build and validate the production site
        run: |
          npm run build:site
          python3 scripts/prepare-cloudflare.py
          npm run check:site

      - name: Upload a preview for verification
        run: npx --yes wrangler@4.152.0 pages deploy _site --project-name chojecki-net --branch verification --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"

      - name: Verify the preview before changing production
        run: |
          python3 scripts/check-live-site.py --base-url https://verification.chojecki-net.pages.dev --allow-preview-noindex --expected-dir _site --attempts 3 --retry-delay 20
          python3 scripts/check-hosting.py --base-url https://verification.chojecki-net.pages.dev --site-dir _site

      - name: Deploy static files to Cloudflare Pages
        run: npx --yes wrangler@4.152.0 pages deploy _site --project-name chojecki-net --branch master --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"

      - name: Verify the Cloudflare deployment against this build
        run: |
          python3 scripts/check-live-site.py --base-url https://chojecki-net.pages.dev --expected-dir _site --attempts 3 --retry-delay 20
          python3 scripts/check-hosting.py --base-url https://chojecki-net.pages.dev --site-dir _site

      - name: Verify the custom domain after cutover
        if: vars.CLOUDFLARE_CUSTOM_DOMAIN_ACTIVE == 'true'
        run: |
          python3 scripts/check-live-site.py --expected-dir _site --attempts 3 --retry-delay 20
          python3 scripts/check-hosting.py --base-url https://chojecki.net --site-dir _site --check-host-redirects
