name: Deploy to GitHub Pages (manual rollback)

# Keep the previous host available; restore DNS before verifying a rollback.
on:
  workflow_dispatch:

permissions: {}

# Only one deployment at a time; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      search_manifest: ${{ steps.search_manifest.outputs.manifest }}
    permissions:
      contents: read
      pages: read
    env:
      BUNDLE_WITHOUT: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build JavaScript assets
        run: |
          npm ci
          npm run build:js

      - name: Test OpenXBL data mapping
        run: npm test

      - name: Test search metadata checks
        run: npm run test:seo

      - name: Fetch Xbox activity
        # Optional personal activity must not block publishing the website.
        continue-on-error: true
        run: node scripts/fetch-openxbl.mjs
        env:
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check generated site
        run: npm run check:site

      - name: Record expected search metadata
        id: search_manifest
        run: |
          geo_manifest=$(python3 scripts/check-live-site.py --manifest-dir _site)
          echo "manifest=$geo_manifest" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        # defaults to uploading _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-search:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check published search metadata
        env:
          EXPECTED_SITE_MANIFEST: ${{ needs.build.outputs.search_manifest }}
        run: python3 scripts/check-live-site.py --require-manifest --attempts 3 --retry-delay 20
